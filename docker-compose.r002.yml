# Optional standalone R002 staging service. Never use the original production Compose file for this test.
name: douliuji-r002-test
services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.r002
    environment:
      NODE_ENV: development
      PORT: "3000"
      DB_PATH: /data/r002-test.db
    ports:
      - "127.0.0.1:3200:3000"
    volumes:
      - ./r002-test-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
