name: douliuji-r001-test

services:
  app:
    build: .
    restart: unless-stopped

    env_file:
      - .env.test

    environment:
      NODE_ENV: development
      PORT: "3000"
      DB_PATH: /data/r001-test.db

    ports:
      - "127.0.0.1:3100:3000"

    volumes:
      - ./r001-test-data:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
